name: koi-blazor
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_DB: koi_blazor
      POSTGRES_USER: koi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Điền POSTGRES_PASSWORD trong .env}
    volumes:
      - koi-blazor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koi -d koi_blazor"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  koi-blazor-postgres-data:
