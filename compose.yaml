services:
  postgres:
    image: postgres:17-alpine
    container_name: koi-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: koi
      POSTGRES_USER: koi
      POSTGRES_PASSWORD: koi
    volumes:
      - koi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koi -d koi"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  koi-postgres-data:
